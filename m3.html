/* Layout: one phone-width column (max 480px). Brand and lesson counter on top with a thin progress line,
   the exercise in the middle, feedback inline under the answer, one action button pinned to the bottom.
   Deliberately one light look: this is an experimental stimulus, so every participant sees the same colours
   regardless of the device theme. No external requests: the fonts are embedded. */
:root{
  /* colour: cool paper, deep Swedish blue, highlighter yellow for Swedish words */
  --ground:#F2F4F7;
  --surface:#FFFFFF;
  --surface-2:#F6F8FA;
  --ink:#141D26;
  --muted:#566271;
  --line:#D4DAE1;
  --accent:#1D4E89;
  --accent-press:#163E6E;
  --accent-tint:#E5EDF7;
  --marker:#FFE072;
  --ok:#17735F;
  --ok-tint:#E3F2EC;
  --ok-line:#9CCFBE;
  --bad:#B03C38;
  --bad-tint:#F9E8E6;
  --bad-line:#E7B3AE;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,29,38,.05),0 4px 14px rgba(20,29,38,.06);
  /* type: a Scandinavian grotesk for headings and Swedish words, a legibility face for reading */
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:0}

/* Swedish words in running text: grotesk plus a highlighter stroke */
.sv{font-family:var(--display);font-weight:700;background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 94%,transparent 94%);padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.svp{font-family:var(--display);font-weight:700}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 0}
.topbar[data-mode="none"]{display:none}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
.wordmark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--accent)}
.wordmark .mark{width:11px;height:18px;border-radius:2px;background:var(--marker);transform:skewX(-14deg)}
.counter{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.track{margin-top:12px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.track-fill{height:100%;width:0;background:var(--accent);transition:width .4s ease}
.topbar[data-mode="brand"] .track{visibility:hidden}

/* screens and footer */
.screen{flex:1;display:flex;flex-direction:column;padding-block:22px 24px}
.footer{position:sticky;bottom:0;z-index:4;background:var(--ground);padding-block:12px calc(16px + env(safe-area-inset-bottom,0px))}
.footer:empty{display:none}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:15px 18px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:700;font-size:17px;transition:background-color .15s}
.btn:hover{background:var(--accent-press)}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:default}

/* exercises */
.ex{display:flex;flex-direction:column}
.ex.locked{pointer-events:none}
.kicker{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.prompt{margin:0 0 18px;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.3;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt,.chip{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-weight:700;transition:border-color .12s,background-color .12s}
.opt{width:100%;text-align:left;padding:13px 14px;font-size:17px}
.key{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--surface-2);border:1.5px solid var(--line);font-size:13px;color:var(--muted)}
.opt-txt{flex:1;min-width:0}
.res{flex:none;display:none;width:22px;height:22px}
.res svg{display:block;width:100%;height:100%}
.selected{border-color:var(--accent);background:var(--accent-tint)}
.selected .key{border-color:var(--accent);color:var(--accent)}
.is-right{border-color:var(--ok);background:var(--ok-tint)}
.is-wrong{border-color:var(--bad);background:var(--bad-tint)}
.is-right .res-ok{display:block;color:var(--ok)}
.is-wrong .res-bad{display:block;color:var(--bad)}
.picture{display:grid;place-items:center;height:136px;margin:0 0 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.emo{font-family:var(--emoji);line-height:1}
.picture .emo{font-size:80px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;padding-block:16px}
.tf .opt-txt{flex:none}
.cloze{margin:0 0 6px;padding:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;font-family:var(--display);font-weight:700;font-size:25px;line-height:1.45}
.gap{display:inline-block;min-width:3.4em;padding:0 .2em;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;line-height:1.2}
.gap.is-right{background:none;border-color:var(--ok);color:var(--ok)}
.gap.is-wrong{background:none;border-color:var(--bad);color:var(--bad)}
.translation{margin:0 0 18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;font-family:var(--display);font-size:19px}
.typein{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:20px;font-weight:700;outline:none}
.typein:focus{border-color:var(--accent)}
.letters{display:flex;gap:8px;margin-top:10px}
.letter{min-width:46px;padding:7px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:18px}

/* feedback, inline under the answer */
.fb-slot{margin-top:18px;scroll-margin-bottom:100px}
.fb-slot:empty{display:none}
.fb-row{display:flex;align-items:center;gap:12px}
.fb{position:relative;flex:1;min-width:0;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.fb[data-tone="ok"]{border-color:var(--ok-line)}
.fb[data-tone="bad"]{border-color:var(--bad-line)}
.fb-head{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px}
.fb[data-tone="ok"] .fb-head{color:var(--ok)}
.fb[data-tone="bad"] .fb-head{color:var(--bad)}
.fb-icon{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--on-accent)}
.fb[data-tone="ok"] .fb-icon{background:var(--ok)}
.fb[data-tone="bad"] .fb-icon{background:var(--bad)}
.fb-icon svg{display:block;width:14px;height:14px}
.fb p{margin:6px 0 0}
.fb .fb-extra{font-size:15px;color:var(--muted)}

/* speech-bubble tails (condition A only) */
.bubble-left::before,.bubble-up::before{content:"";position:absolute;width:14px;height:14px;background:inherit;border-style:solid;border-color:inherit;transform:rotate(45deg)}
.bubble-left::before{left:-8px;top:calc(40% - 7px);border-width:0 0 1.5px 1.5px}
.bubble-up::before{top:-8px;left:calc(50% - 7px);border-width:1.5px 0 0 1.5px}

/* message screens */
.msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.msg-card{position:relative;align-self:stretch;padding:20px 20px 18px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.msg-card h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;text-wrap:balance}
.msg-card p{margin:10px 0 0}
.label{margin-top:16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.word-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.word-chip{padding:3px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:15px}

/* word lists */
.wl-sub{margin:-8px 0 16px;color:var(--muted)}
.wl-list{margin:0;padding:0;list-style:none;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.wl-item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 44px;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.wl-list.no-emo .wl-item{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.wl-item:first-child{border-top:0}
.wl-sv{font-family:var(--display);font-weight:700;font-size:21px;overflow-wrap:anywhere}
.wl-en{color:var(--muted);overflow-wrap:anywhere}
.wl-emo{font-size:28px;text-align:right}

/* avatar (condition A only) */
.agent{flex:none;display:flex;flex-direction:column;align-items:center}
.agent-md .agent-fig{width:clamp(112px,35vw,146px)}
.agent-lg .agent-fig{width:clamp(172px,52vw,220px)}
.agent-name{margin-top:2px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.moose{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 85%}
.moose .m-eyes{transform-box:fill-box;transform-origin:center;animation:m-blink 4.6s infinite}
.agent-fig[data-mood="happy"] .moose{animation:m-bounce .7s ease-out both}
.agent-fig[data-mood="encourage"] .moose{animation:m-tilt 1.1s ease-in-out both}
.agent-fig[data-mood="sad"] .moose{animation:m-shake 1.6s ease-in-out .35s both}
.agent-fig.celebrate .moose{animation:m-jump 1s ease-out 2 both}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes m-bounce{0%,52%,100%{transform:translateY(0)}28%{transform:translateY(-9%)}74%{transform:translateY(-3%)}}
@keyframes m-jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12%) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
@keyframes m-tilt{0%,100%{transform:rotate(0)}35%,70%{transform:rotate(-8deg)}}
@keyframes m-shake{0%,100%{transform:rotate(0)}14%{transform:rotate(-7deg)}32%{transform:rotate(7deg)}50%{transform:rotate(-5deg)}68%{transform:rotate(4deg)}84%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){
  .moose,.moose .m-eyes{animation:none!important}
  .track-fill{transition:none}
}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="topbar" id="topbar" data-mode="brand">
    <div class="topbar-row">
      <span class="wordmark"><span class="mark" aria-hidden="true"></span><span id="brandName">Ordbit</span></span>
      <span class="counter" id="counter"></span>
    </div>
    <div class="track" aria-hidden="true"><div class="track-fill" id="trackFill"></div></div>
  </header>
  <main class="screen" id="screen"></main>
  <footer class="footer" id="footer"></footer>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIGURATION: normally the only block you need to edit
   ===================================================================== */
var CONFIG = {
  DEFAULT_COND: 'B',   // 'A' = with avatar, 'B' = without avatar. The URL parameter ?cond=A|B|random overrides this.
  APP_NAME: 'Ordbit',
  AGENT_NAME: 'Olle',
  // The app ends on the final summary; participants see nothing after it.
  // If the app runs inside the questionnaire page (iframe) and its URL contains a PROLIFIC_PID,
  // it silently sends the results to that page via postMessage. Before going live, replace '*'
  // with the questionnaire's origin, e.g. 'https://survey.example.org'.
  EMBED_ORIGIN: '*'
};
var COOL = {ms:350};  // ignores clicks briefly after each change, so a double click cannot skip the feedback

/* =====================================================================
   CONDITION AND PROLIFIC PARAMETERS
   ===================================================================== */
var qs = new URLSearchParams(window.location.search);
var PID = qs.get('PROLIFIC_PID') || '';
var STUDY_ID = qs.get('STUDY_ID') || '';
var SESSION_ID = qs.get('SESSION_ID') || '';
function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function resolveCond(){
  var raw=(qs.get('cond')||'').trim().toLowerCase();
  if(raw==='a'||raw==='avatar') return 'A';
  if(raw==='b'||raw==='control') return 'B';
  if(raw==='random') return PID ? (hash(PID)%2 ? 'A' : 'B') : (Math.random()<0.5 ? 'A' : 'B');
  return CONFIG.DEFAULT_COND==='B' ? 'B' : 'A';
}
var COND = resolveCond();
var AVATAR = COND==='A';

/* =====================================================================
   CONTENT: identical in both conditions.
   *word* marks Swedish text. Option order is fixed (not shuffled),
   so every participant sees exactly the same stimulus.
   Word lists introduce the words before they are practised.
   ===================================================================== */
var LESSON = [
  {kind:'words', words:[['hej','hello'],['tack','thank you'],['ja','yes'],['nej','no']]},
  {kind:'choice', prompt:'What does *tack* mean?', options:['hello','thank you','goodbye','yes'], answer:'thank you',
   explain:'*Tack* means “thank you”.', tip:'*Tack* sounds a bit like “thanks”.'},
  {kind:'choice', optSv:true, prompt:'How do you say “hello” in Swedish?', options:['tack','nej','hej','ja'], answer:'hej',
   explain:'*Hej* means “hello” or “hi”.', tip:'*Hej* sounds just like “hey”.'},
  {kind:'tf', statement:'*Nej* means “yes”.', answer:false, explain:'*Nej* means “no”. “Yes” is *ja*.'},
  {kind:'words', words:[['katt','cat','🐱'],['hund','dog','🐶'],['vatten','water','💧'],['kaffe','coffee','☕️'],['bröd','bread','🍞']]},
  {kind:'picture', emoji:'🐱', label:'cat', options:['hund','katt','bröd','vatten'], answer:'katt',
   explain:'*Katt* means “cat”.', tip:'*Katt* sounds like “cat”.'},
  {kind:'picture', emoji:'☕️', label:'coffee', options:['vatten','kaffe','hund','bröd'], answer:'kaffe',
   explain:'*Kaffe* means “coffee”.', tip:'*Kaffe* sounds like “coffee”.'},
  {kind:'choice', prompt:'What does *hund* mean?', options:['cat','dog','bread','water'], answer:'dog',
   explain:'*Hund* means “dog”.', tip:'Think of the English word “hound”.'},
  {kind:'tf', statement:'*Bröd* means “bread”.', answer:true, explain:'*Bröd* means “bread”.'},
  {kind:'halfway'},
  {kind:'words', words:[['jag','I'],['dricker','drink, drinks'],['äter','eat, eats'],['heter','am called, is called']]},
  {kind:'cloze', before:'Jag', after:'kaffe.', translation:'I drink coffee.', options:['äter','dricker','heter'], answer:'dricker',
   full:'Jag dricker kaffe.', tip:'*dricker* = drink, *äter* = eat.'},
  {kind:'cloze', before:'Jag', after:'bröd.', translation:'I eat bread.', options:['dricker','heter','äter'], answer:'äter',
   full:'Jag äter bröd.', tip:'*äter* = eat, *dricker* = drink.'},
  {kind:'type', prompt:'Type the Swedish word for “water”.', answer:'vatten',
   explain:'*Vatten* means “water”.', tip:'It is spelled with two t’s: v-a-t-t-e-n.'},
  {kind:'choice', optSv:true, prompt:'Which sentence means “I drink water”?', options:['Jag äter vatten.','Jag dricker vatten.','Jag dricker kaffe.','Hej, vatten.'], answer:'Jag dricker vatten.',
   explain:'*Jag dricker vatten.* means “I drink water.”', tip:'*dricker* = drink, *äter* = eat.'},
  {kind:'cloze', before:'Hej, jag', after:'Anna.', translation:'Hi, my name is Anna.', options:['heter','dricker','äter'], answer:'heter',
   full:'Hej, jag heter Anna.', tip:'Swedes say *jag heter …*, literally “I am called …”.'}
];

/* Messages: identical wording in both conditions, no first-person agent language ("I", "we"),
   so the only difference between A and B is who presents the text. */
var TEXT = {
  intro:   {title:'*Välkommen!*', body:['*Välkommen* is Swedish for “welcome”. In the next few minutes you will learn your first Swedish words.','First you see a few new words, then you practise them. After each exercise you get feedback on your answer.'], button:'Start lesson'},
  words:   {title:'New words', sub:'Read them carefully. You will practise them next.', button:'Practise these words'},
  halfway: {title:'Halfway there!', body:function(n){ return ['You have already practised '+n+' new Swedish words. Keep going!']; }, button:'Continue'},
  summary: {title:'Lesson finished', body:function(c,n){ return ['Well done! You answered '+c+' of '+n+' exercises correctly.']; }, label:'Your new words'}
};
var KICKER = {meaning:'Meaning', swedish:'In Swedish', picture:'Picture', tf:'True or false', cloze:'Fill the gap', type:'Write it'};
var PRAISE = ['Correct!','Well done!','Exactly!','That’s right!','Very good!'];

/* =====================================================================
   FLOW: one single run. Intro, the lesson, summary. The summary is the last screen.
   ===================================================================== */
var FLOW = [{t:'intro'}];
LESSON.forEach(function(it){
  if(it.kind==='words') FLOW.push({t:'words', words:it.words});
  else if(it.kind==='halfway') FLOW.push({t:'halfway'});
  else FLOW.push({t:'ex', ex:it});
});
FLOW.push({t:'summary'});

var S = {step:0, praise:0, t0:0, cool:0, awaitNext:false, keyPick:null, fbShown:0, result:null,
         L:{c:0, n:0, seq:'', words:[], done:0, t0:0, t1:0, fb:[],
            total:LESSON.filter(function(i){ return i.kind!=='words' && i.kind!=='halfway'; }).length}};

/* =====================================================================
   HELPERS
   ===================================================================== */
function $(id){ return document.getElementById(id); }
var $top=$('topbar'), $fill=$('trackFill'), $counter=$('counter'), $screen=$('screen'), $footer=$('footer');
var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rich(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<span class="sv" lang="sv">$1</span>');
}
var ICON = {
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.3 4.3L19 7.2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cross:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>'
};
var RES = '<span class="res res-ok" aria-hidden="true">'+ICON.check+'</span><span class="res res-bad" aria-hidden="true">'+ICON.cross+'</span>';
var SLOT = '<div class="fb-slot" id="fbSlot"></div>';
function setTop(mode, exNum){
  $top.setAttribute('data-mode', mode);
  $fill.style.width=(100*S.L.done/S.L.total)+'%';
  $counter.textContent = exNum ? 'Exercise '+exNum+' of '+S.L.total : '';
}
function footerButton(label, onClick, opts){
  opts=opts||{};
  var id=opts.id||'nextBtn';
  $footer.innerHTML='<button class="btn" type="button" id="'+id+'"'+(opts.disabled?' disabled':'')+'>'+esc(label)+'</button>';
  var b=$(id);
  b.addEventListener('click', function(e){ if(Date.now()<S.cool) return; onClick(e); });
  return b;
}

/* =====================================================================
   AVATAR: "Olle", a moose. Social cues after Feine et al. (2019):
   visual (appearance, facial expression, head movement, blinking), speech bubble, own name.
   ===================================================================== */
var MC = {fur:'#9A6A45', ear:'#87593A', muzzle:'#CB9D6F', line:'#61401F', dark:'#1F2328', antler:'#E9D2A6',
          scarf:'#1D4E89', stripe:'#FFE072', cheek:'#F0A095', tongue:'#DE7672', white:'#FFFFFF'};
function antlerAndEar(){
  return '<path d="M58 46 L44 33" stroke="'+MC.antler+'" stroke-width="8" stroke-linecap="round" fill="none"/>'+
    '<ellipse cx="30" cy="24" rx="20" ry="11" transform="rotate(30 30 24)" fill="'+MC.antler+'"/>'+
    '<circle cx="13" cy="14" r="6" fill="'+MC.antler+'"/><circle cx="23.4" cy="7.5" r="6" fill="'+MC.antler+'"/>'+
    '<circle cx="31.2" cy="12" r="5.5" fill="'+MC.antler+'"/><circle cx="39" cy="16.5" r="5.5" fill="'+MC.antler+'"/><circle cx="45.9" cy="20.5" r="5" fill="'+MC.antler+'"/>'+
    '<ellipse cx="41" cy="57" rx="14" ry="7.5" transform="rotate(28 41 57)" fill="'+MC.ear+'"/>'+
    '<ellipse cx="42.5" cy="57.8" rx="8" ry="3.6" transform="rotate(28 42.5 57.8)" fill="'+MC.muzzle+'"/>';
}
function mooseSVG(mood){
  var happy=mood==='happy', enc=mood==='encourage', sad=mood==='sad';
  var bl='', br='';
  if(happy){ bl='translate(0 -3)'; br='translate(0 -3)'; }
  if(enc){ bl='translate(0 -2) rotate(-9 63 51)'; br='translate(0 -2) rotate(9 97 51)'; }
  if(sad){ bl='translate(0 1) rotate(-15 63 51)'; br='translate(0 1) rotate(15 97 51)'; }
  var eyes;
  if(happy){
    eyes='<g fill="none" stroke="'+MC.dark+'" stroke-width="4" stroke-linecap="round"><path d="M55 71 Q64 61 73 71"/><path d="M87 71 Q96 61 105 71"/></g>';
  } else {
    var py = sad ? 2.5 : 0;
    eyes='<g class="m-eyes"><ellipse cx="64" cy="68" rx="9" ry="10.5" fill="'+MC.white+'"/><ellipse cx="96" cy="68" rx="9" ry="10.5" fill="'+MC.white+'"/>'+
      '<g transform="translate(0 '+py+')"><circle cx="65" cy="70" r="5" fill="'+MC.dark+'"/><circle cx="97" cy="70" r="5" fill="'+MC.dark+'"/>'+
      '<circle cx="67" cy="67.6" r="1.8" fill="'+MC.white+'"/><circle cx="99" cy="67.6" r="1.8" fill="'+MC.white+'"/></g>'+
      (sad ? '<path d="M55 68 A9 10.5 0 0 1 73 68 Z" fill="'+MC.fur+'"/><path d="M87 68 A9 10.5 0 0 1 105 68 Z" fill="'+MC.fur+'"/>'+
             '<path d="M55.5 68 L72.5 68 M87.5 68 L104.5 68" stroke="'+MC.line+'" stroke-width="2.5" stroke-linecap="round"/>' : '')+
      '</g>';
  }
  var mouth;
  if(happy) mouth='<path d="M68 107 Q80 124 92 107 Q80 111 68 107 Z" fill="'+MC.line+'"/><path d="M74.5 113.5 Q80 119.5 85.5 113.5 Q80 111.5 74.5 113.5 Z" fill="'+MC.tongue+'"/>';
  else if(enc) mouth='<path d="M70 109 Q80 117 90 109" fill="none" stroke="'+MC.line+'" stroke-width="3.5" stroke-linecap="round"/>';
  else if(sad) mouth='<path d="M71 115 Q80 108 89 115" fill="none" stroke="'+MC.line+'" stroke-width="3.5" stroke-linecap="round"/>';
  else mouth='<path d="M72 110 Q80 114 88 110" fill="none" stroke="'+MC.line+'" stroke-width="3.5" stroke-linecap="round"/>';
  var cheeks = happy ? '<circle cx="53" cy="86" r="6.5" fill="'+MC.cheek+'" opacity=".85"/><circle cx="107" cy="86" r="6.5" fill="'+MC.cheek+'" opacity=".85"/>' : '';
  return '<svg class="moose" viewBox="0 0 160 160" aria-hidden="true" focusable="false">'+
    antlerAndEar()+
    '<g transform="translate(160 0) scale(-1 1)">'+antlerAndEar()+'</g>'+
    '<rect x="60" y="98" width="40" height="30" rx="8" fill="'+MC.ear+'"/>'+
    '<ellipse cx="80" cy="72" rx="40" ry="38" fill="'+MC.fur+'"/>'+
    '<ellipse cx="80" cy="100" rx="31" ry="21" fill="'+MC.muzzle+'"/>'+
    '<ellipse cx="70" cy="96" rx="4.5" ry="3.2" fill="'+MC.line+'"/><ellipse cx="90" cy="96" rx="4.5" ry="3.2" fill="'+MC.line+'"/>'+
    cheeks+eyes+
    '<path d="M55 53 Q63 49 71 52" fill="none" stroke="'+MC.line+'" stroke-width="4.5" stroke-linecap="round"'+(bl?' transform="'+bl+'"':'')+'/>'+
    '<path d="M89 52 Q97 49 105 53" fill="none" stroke="'+MC.line+'" stroke-width="4.5" stroke-linecap="round"'+(br?' transform="'+br+'"':'')+'/>'+
    mouth+
    '<rect x="92" y="124" width="14" height="28" rx="5" fill="'+MC.scarf+'"/><rect x="92" y="140" width="14" height="3.5" fill="'+MC.stripe+'"/>'+
    '<rect x="44" y="117" width="72" height="16" rx="8" fill="'+MC.scarf+'"/><rect x="46" y="123.5" width="68" height="3.5" fill="'+MC.stripe+'"/>'+
    '</svg>';
}
function agentHTML(mood, size, extra){
  return '<div class="agent agent-'+size+'"><div class="agent-fig'+(extra?' '+extra:'')+'" data-mood="'+mood+'">'+mooseSVG(mood)+'</div>'+
         '<div class="agent-name">'+esc(CONFIG.AGENT_NAME)+'</div></div>';
}

/* =====================================================================
   SCREENS
   ===================================================================== */
function go(){
  var st=FLOW[S.step];
  S.cool=Date.now()+COOL.ms; S.keyPick=null; S.awaitNext=false;
  $screen.innerHTML=''; $footer.innerHTML='';
  try{ window.scrollTo(0,0); }catch(e){}
  if(st.t==='intro') return renderIntro();
  if(st.t==='words') return renderWords(st);
  if(st.t==='halfway') return renderHalfway();
  if(st.t==='ex') return renderExercise(st);
  if(st.t==='summary') return renderSummary();
}
function next(){ if(S.step<FLOW.length-1){ S.step++; go(); } }

function renderMessage(o){
  setTop(o.top||'brand');
  var agent = AVATAR ? agentHTML(o.mood, 'lg', o.celebrate ? 'celebrate' : '') : '';
  $screen.innerHTML='<section class="msg">'+agent+
    '<div class="msg-card'+(AVATAR?' bubble-up':'')+'" id="msgCard"><h2>'+rich(o.title)+'</h2>'+
    o.body.map(function(p){ return '<p>'+rich(p)+'</p>'; }).join('')+(o.extra||'')+'</div></section>';
  if(o.button) footerButton(o.button, o.onNext||next);
}
function renderIntro(){
  renderMessage({mood:'happy', top:'brand', title:TEXT.intro.title, body:TEXT.intro.body, button:TEXT.intro.button,
    onNext:function(){ S.t0=Date.now(); next(); }});
}
function renderWords(st){
  var hasEmo=st.words.some(function(w){ return !!w[2]; });
  st.words.forEach(function(w){ if(S.L.words.indexOf(w[0])<0) S.L.words.push(w[0]); });
  setTop('lesson');
  $screen.innerHTML='<section class="wl" id="wl"><h1 class="prompt">'+esc(TEXT.words.title)+'</h1><p class="wl-sub">'+esc(TEXT.words.sub)+'</p>'+
    '<ul class="wl-list'+(hasEmo?'':' no-emo')+'">'+st.words.map(function(w){
      return '<li class="wl-item"><span class="wl-sv" lang="sv">'+esc(w[0])+'</span><span class="wl-en">'+esc(w[1])+'</span>'+
             (hasEmo ? '<span class="wl-emo emo" aria-hidden="true">'+(w[2]||'')+'</span>' : '')+'</li>';
    }).join('')+'</ul></section>';
  footerButton(TEXT.words.button, next);
}
function renderHalfway(){
  renderMessage({mood:'happy', top:'lesson', title:TEXT.halfway.title, body:TEXT.halfway.body(S.L.words.length), button:TEXT.halfway.button});
}
/* Last screen of the app: no button, nothing follows. */
function renderSummary(){
  var T=TEXT.summary;
  var extra='<div class="label">'+esc(T.label)+'</div><div class="word-chips">'+
    S.L.words.map(function(w){ return '<span class="word-chip" lang="sv">'+esc(w)+'</span>'; }).join('')+'</div>';
  renderMessage({mood:'happy', celebrate:true, top:'lesson', title:T.title, body:T.body(S.L.c, S.L.n), extra:extra});
  finish();
}
function finish(){
  var L=S.L, d={};
  if(PID) d.PROLIFIC_PID=PID;
  if(STUDY_ID) d.STUDY_ID=STUDY_ID;
  if(SESSION_ID) d.SESSION_ID=SESSION_ID;
  d.cond=COND;                                   // A or B
  d.correct=L.c;                                 // correct answers
  d.total=L.n;                                   // exercises answered
  d.seq=L.seq;                                   // 1 = correct, 0 = wrong, in order
  d.secs=(L.t0 && L.t1) ? Math.round((L.t1-L.t0)/1000) : '';   // first exercise to last answer, seconds
  d.fbms=L.fb.length ? Math.round(L.fb.reduce(function(a,b){ return a+b; },0)/L.fb.length) : '';  // mean time on feedback, ms
  d.dur=S.t0 ? Math.round((Date.now()-S.t0)/1000) : '';     // Start button to summary, seconds
  S.result=d;
  if(PID && window.parent && window.parent!==window){
    try{ window.parent.postMessage({source:'ordbit', event:'complete', data:d}, CONFIG.EMBED_ORIGIN); }catch(e){}
  }
}

/* =====================================================================
   EXERCISES
   ===================================================================== */
function renderExercise(st){
  var ex=st.ex;
  if(!S.L.t0) S.L.t0=Date.now();
  setTop('lesson', S.L.done+1);
  var done=function(ok, info){ complete(st, ok, info||{}); };
  ({choice:exChoice, picture:exPicture, tf:exTF, cloze:exCloze, type:exType})[ex.kind](ex, done);
}
function head(kicker, promptHTML){ return '<div class="kicker">'+esc(kicker)+'</div><h1 class="prompt">'+promptHTML+'</h1>'; }
function lockEx(){ var e=$('ex'); if(e) e.classList.add('locked'); S.keyPick=null; }
function mark(items, picked, correct){
  items[correct].classList.add('is-right');
  if(picked!==correct) items[picked].classList.add('is-wrong');
}
function selectable(selector, onCheck, onPick){
  var picked=-1, items=[].slice.call($screen.querySelectorAll(selector));
  var btn=footerButton('Check answer', function(){
    if(picked<0) return;
    lockEx();
    items.forEach(function(x){ x.classList.remove('selected'); x.removeAttribute('aria-pressed'); x.disabled=true; });
    onCheck(picked, items);
  }, {disabled:true, id:'checkBtn'});
  items.forEach(function(b){
    b.addEventListener('click', function(){
      picked=+b.getAttribute('data-i');
      items.forEach(function(x){ x.classList.toggle('selected', x===b); x.setAttribute('aria-pressed', x===b ? 'true' : 'false'); });
      btn.disabled=false;
      if(onPick) onPick(picked);
    });
  });
  S.keyPick=function(i){ if(i<items.length) items[i].click(); };
}
function optionButtons(options, sv){
  return options.map(function(o,i){
    return '<button class="opt" type="button" aria-pressed="false" data-i="'+i+'"><span class="key">'+'ABCD'.charAt(i)+'</span>'+
           '<span class="opt-txt'+(sv?' svp':'')+'"'+(sv?' lang="sv"':'')+'>'+esc(o)+'</span>'+RES+'</button>';
  }).join('');
}
function exChoice(ex, done){
  var sv=!!ex.optSv;
  $screen.innerHTML='<div class="ex" id="ex">'+head(sv?KICKER.swedish:KICKER.meaning, rich(ex.prompt))+
    '<div class="opts">'+optionButtons(ex.options, sv)+'</div></div>'+SLOT;
  selectable('.opt', function(i, items){ var c=ex.options.indexOf(ex.answer); mark(items,i,c); done(i===c,{}); });
}
function exPicture(ex, done){
  $screen.innerHTML='<div class="ex" id="ex">'+head(KICKER.picture, 'What is this in Swedish?')+
    '<div class="picture" role="img" aria-label="'+esc(ex.label)+'"><span class="emo" aria-hidden="true">'+ex.emoji+'</span></div>'+
    '<div class="opts">'+optionButtons(ex.options, true)+'</div></div>'+SLOT;
  selectable('.opt', function(i, items){ var c=ex.options.indexOf(ex.answer); mark(items,i,c); done(i===c,{}); });
}
function exTF(ex, done){
  $screen.innerHTML='<div class="ex" id="ex">'+head(KICKER.tf, rich(ex.statement))+'<div class="tf">'+
    ['True','False'].map(function(o,i){ return '<button class="opt" type="button" aria-pressed="false" data-i="'+i+'"><span class="opt-txt">'+o+'</span>'+RES+'</button>'; }).join('')+
    '</div></div>'+SLOT;
  selectable('.opt', function(i, items){ var c=ex.answer ? 0 : 1; mark(items,i,c); done(i===c,{}); });
}
function exCloze(ex, done){
  var after = ex.after ? ((/^[.,!?]/.test(ex.after) ? '' : ' ')+esc(ex.after)) : '';
  $screen.innerHTML='<div class="ex" id="ex">'+head(KICKER.cloze, 'Complete the sentence.')+
    '<p class="cloze" lang="sv">'+esc(ex.before)+' <span class="gap" id="gap">&nbsp;</span>'+after+'</p>'+
    '<p class="translation">“'+esc(ex.translation)+'”</p><div class="chips">'+
    ex.options.map(function(o,i){ return '<button class="chip" type="button" aria-pressed="false" lang="sv" data-i="'+i+'"><span>'+esc(o)+'</span>'+RES+'</button>'; }).join('')+
    '</div></div>'+SLOT;
  var gap=$('gap');
  selectable('.chip', function(i, items){
    var c=ex.options.indexOf(ex.answer);
    mark(items,i,c);
    gap.classList.add(i===c ? 'is-right' : 'is-wrong');
    done(i===c,{});
  }, function(i){ gap.textContent=ex.options[i]; });
}
function lev(a,b){
  var m=a.length, n=b.length, d=[], i, j;
  for(i=0;i<=m;i++) d[i]=[i];
  for(j=0;j<=n;j++) d[0][j]=j;
  for(i=1;i<=m;i++) for(j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function exType(ex, done){
  $screen.innerHTML='<div class="ex" id="ex">'+head(KICKER.type, rich(ex.prompt))+
    '<input class="typein" id="typein" type="text" lang="sv" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type in Swedish" aria-label="Your answer">'+
    '<div class="letters">'+['å','ä','ö'].map(function(l){ return '<button class="letter" type="button" data-l="'+l+'" aria-label="Insert '+l+'">'+l+'</button>'; }).join('')+'</div></div>'+SLOT;
  var inp=$('typein');
  var btn=footerButton('Check answer', submit, {disabled:true, id:'checkBtn'});
  function submit(){
    if(S.awaitNext) return;
    var v=inp.value.trim().toLowerCase().replace(/[.!?,;:]+$/,'');
    if(!v) return;
    lockEx(); inp.readOnly=true; inp.blur();
    var target=ex.answer.toLowerCase(), ok=v===target, typo=false;
    if(!ok && target.length>=4 && lev(v,target)===1){ ok=true; typo=true; }
    inp.classList.add(ok ? 'is-right' : 'is-wrong');
    done(ok, {typo:typo});
  }
  inp.addEventListener('input', function(){ btn.disabled=!inp.value.trim(); });
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); if(!S.awaitNext && !btn.disabled && Date.now()>=S.cool) submit(); } });
  [].forEach.call($screen.querySelectorAll('.letter'), function(b){
    b.addEventListener('click', function(){
      var l=b.getAttribute('data-l');
      var s=inp.selectionStart==null ? inp.value.length : inp.selectionStart;
      var en=inp.selectionEnd==null ? s : inp.selectionEnd;
      inp.value=inp.value.slice(0,s)+l+inp.value.slice(en);
      inp.focus();
      try{ inp.setSelectionRange(s+1,s+1); }catch(e){}
      btn.disabled=!inp.value.trim();
    });
  });
  setTimeout(function(){ try{ inp.focus({preventScroll:true}); }catch(e){} }, 80);
}

/* =====================================================================
   FEEDBACK: the text is built from the same rules in both conditions.
   Condition A adds only the avatar, its name and the speech-bubble frame.
   ===================================================================== */
function explainOf(ex){ return ex.kind==='cloze' ? '*'+ex.full+'* means “'+ex.translation+'”' : ex.explain; }
function answerDisplay(ex){
  if(ex.kind==='cloze') return '*'+ex.full+'*';
  if(ex.kind==='picture' || ex.kind==='type') return '*'+ex.answer+'*';
  return ex.optSv ? '*'+ex.answer+'*' : '“'+ex.answer+'”';
}
function feedback(ex, ok, info){
  if(ok){
    var headTxt=PRAISE[S.praise % PRAISE.length]; S.praise++;
    return {tone:'ok', mood:'happy', head:headTxt, body:explainOf(ex), extra: info.typo ? 'Watch the spelling: *'+ex.answer+'*.' : ''};
  }
  var body = ex.kind==='tf' ? 'This statement is '+(ex.answer ? 'true' : 'false')+'. '+ex.explain : 'Correct answer: '+answerDisplay(ex);
  return {tone:'bad', mood:'encourage', head:'Not quite.', body:body, extra: ex.tip ? 'Tip: '+ex.tip : ''};
}
function complete(st, ok, info){
  var L=S.L;
  L.n++; L.done++; L.seq+=ok ? '1' : '0'; L.t1=Date.now();
  if(ok) L.c++;
  $fill.style.width=(100*L.done/L.total)+'%';
  showFeedback(feedback(st.ex, ok, info));
}
function showFeedback(fb){
  var slot=$('fbSlot');
  slot.innerHTML='<div class="fb-row">'+(AVATAR ? agentHTML(fb.mood,'md','') : '')+
    '<div class="fb'+(AVATAR?' bubble-left':'')+'" data-tone="'+fb.tone+'" id="fbCard" role="status">'+
    '<div class="fb-head"><span class="fb-icon" aria-hidden="true">'+(fb.tone==='ok' ? ICON.check : ICON.cross)+'</span><span>'+rich(fb.head)+'</span></div>'+
    '<p class="fb-body">'+rich(fb.body)+'</p>'+(fb.extra ? '<p class="fb-extra">'+rich(fb.extra)+'</p>' : '')+'</div></div>';
  S.fbShown=Date.now(); S.cool=Date.now()+COOL.ms; S.awaitNext=true;
  var b=footerButton('Next', function(){ S.L.fb.push(Date.now()-S.fbShown); next(); });
  requestAnimationFrame(function(){ try{ slot.scrollIntoView({block:'end', behavior: reduceMotion ? 'auto' : 'smooth'}); }catch(e){} });
  setTimeout(function(){ try{ b.focus({preventScroll:true}); }catch(e){} }, 60);
}

/* keyboard: Enter = Check / Next, 1-4 or A-D = choose an option */
document.addEventListener('keydown', function(e){
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.key==='Enter'){
    var b=$footer.querySelector('button:not([disabled])');
    if(b){ e.preventDefault(); b.click(); }
  } else if(!S.awaitNext && S.keyPick){
    var k=String(e.key).toLowerCase(), i='1234'.indexOf(k);
    if(i<0) i='abcd'.indexOf(k);
    if(i>=0 && k.length===1) S.keyPick(i);
  }
});

$('brandName').textContent=CONFIG.APP_NAME;
window.__ordbit = {S:S, FLOW:FLOW, COND:COND, result:function(){ return S.result; }, setCool:function(ms){ COOL.ms=ms; }};
go();
})();
</script>
